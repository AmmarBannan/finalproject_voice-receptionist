# docker compose up --build
#   clinic-api  http://localhost:8101   the simulated clinic (system of record)
#   app         http://localhost:8000   the receptionist (API contract; runs the MCP server inside)
#   ui          http://localhost:7860   the Gradio UI for patients
# For the eval cases, set CLINIC_TODAY=2026-11-02 in .env first.
services:
  clinic-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8101:8101"
    environment:
      CLINIC_API_KEY: ${CLINIC_API_KEY:-dev-key-change-me}
      CLINIC_TODAY: ${CLINIC_TODAY:-}
      CLINIC_TIME: ${CLINIC_TIME:-}

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CLINIC_API_URL: http://clinic-api:8101
      CLINIC_API_KEY: ${CLINIC_API_KEY:-dev-key-change-me}
    volumes:
      - app-data:/app/data
    depends_on:
      clinic-api:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "7860:7860"
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
